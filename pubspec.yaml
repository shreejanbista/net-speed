name: net_speed
description: "Real-time internet speed monitor & data usage tracker for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Charts
  fl_chart: ^0.69.0

  # Local storage
  shared_preferences: ^2.3.0

  # Network detection
  connectivity_plus: ^6.0.0

  # Typography
  google_fonts: ^6.2.0

  # Icons
  cupertino_icons: ^1.0.8

  # Intl for formatting
  intl: ^0.19.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
